name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GS1Marker.slnx

      - name: Build
        run: dotnet build GS1Marker.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GS1Marker.slnx --configuration Release --no-build